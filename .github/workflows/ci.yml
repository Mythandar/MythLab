name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore MythLab.slnx --locked-mode
      - name: Build Release
        run: dotnet build MythLab.slnx -c Release --no-restore
      - name: Test Core (offline)
        run: dotnet test tests/MythLab.Core.Tests/MythLab.Core.Tests.csproj -c Release --no-build --no-restore
      - name: Test Infrastructure (offline)
        run: dotnet test tests/MythLab.Infrastructure.Tests/MythLab.Infrastructure.Tests.csproj -c Release --no-build --no-restore --filter "Category!=LocalNetwork"
